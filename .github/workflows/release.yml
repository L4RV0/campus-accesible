name: Release

# Al subir una etiqueta vX.Y.Z se construye la aplicación, se vuelven a correr
# todas las pruebas y se publica el .jar como Release de GitHub.
# Así cada versión desplegable queda guardada y se puede volver a la anterior.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    name: Construir y publicar la versión
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código de la etiqueta
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar las pruebas
        run: ./mvnw -B verify

      # GITHUB_TOKEN es un secreto que GitHub inyecta en cada ejecución.
      # Nunca aparece en el código ni en los registros (se muestra como ***).
      - name: Publicar el .jar como Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/campus-accesible-*.jar \
            --title "CampusAccesible $GITHUB_REF_NAME" \
            --notes "Versión construida desde $GITHUB_SHA. Pruebas: todas en verde (ver la ejecución de este workflow)."
