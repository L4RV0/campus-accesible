spring.application.name=campus-accesible
server.error.include-stacktrace=never

# DevOps: versión desplegada y estado, sin exponer nada más
management.endpoints.web.exposure.include=health,info
management.info.build.enabled=true
management.info.java.enabled=true
management.endpoint.health.show-details=never

# Logs: por defecto a la consola. Para guardarlos en archivo:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.arguments=--logging.file.name=logs/campus.log"
logging.level.ec.campus.accesible=INFO
